name: template-self-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-template-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run offline template suite
        run: ./scripts/test-template.sh

  gsd-installer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned GSD into Claude project surface
        shell: bash
        run: |
          source .orchestration/versions.env
          npx --yes "@opengsd/gsd-core@$GSD_VERSION" --claude --local

      - name: Reconcile starter-owned runtime settings
        run: ./scripts/reconcile-runtime-config.py

      - name: Overlay keys accepted by pinned GSD
        run: python3 tests/test_gsd_keys.py

      - name: Validate resulting repository
        run: ./scripts/self-check.sh --offline
